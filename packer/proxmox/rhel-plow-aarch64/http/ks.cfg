lang en_US
keyboard --xlayouts='us'
timezone America/Chicago --utc
rootpw <encrypted password> --iscrypted
reboot
text
cdrom
bootloader --append="rhgb quiet crashkernel=1G-4G:192M,4G-64G:256M,64G-:512M"
bootloader --append="rhgb quiet crashkernel=1G-4G:256M,4G-64G:320M,64G-:576M" --location=mbr --boot-drive=sda
zerombr
clearpart --all --initlabel
# Generated using Blivet version 3.6.0
ignoredisk --only-use=sda
autopart
network  --bootproto=dhcp --device=link --activate
skipx
firstboot --disable
user --groups=wheel --name=<user> --password=<user_pass> --iscrypted
user --groups=wheel --name=<packer_user> --password=<packer_pass>

%addon
com_redhat_kdump --enable --reserve-mb='auto'
%end

%packages
@^minimal-environment
qemu-guest-agent
%end

%post --log=/root/registration_results.out
subscription-manager register --auto-attach --username=<rhel_user> --password=<rhel_pass>
%end