lang en_US
keyboard --xlayouts='us'
timezone America/Chicago --utc
rootpw <encrypted password> --iscrypted
reboot
text
cdrom
bootloader --append="rhgb quiet crashkernel=1G-4G:192M,4G-64G:256M,64G-:512M"
zerombr
clearpart --all --initlabel
autopart
network --bootproto=dhcp
skipx
firstboot --disable
selinux --disabled
user --groups=wheel --name=<user> --password=<user_pass>
sshkey --username=<user> "public_key_goes_here"

%packages
@^minimal-environment
kexec-tools
qemu-guest-agent
cloud-init
%end

%post --log=/root/ks_post.out
subscription-manager register --username=<rhel_user> --password='<rhel_pass'
subscription-manager repos \
    --enable=rhel-9-server-rpms \
    --enable=rhel-9-server-rh-common-rpms
%end